name: Build PSP game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL2 for PSP
        run: psp-pacman -Syu --noconfirm sdl2
      - name: Show where SDL.h lives (helps me debug)
        run: find /usr/local/pspdev -name "SDL.h" ; psp-pkg-config --cflags --libs sdl2 || true
      - name: Build
        run: make
      - name: Save the game file
        uses: actions/upload-artifact@v4
        with:
          name: SonicPSP
          path: EBOOT.PBP

