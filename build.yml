name: Build PSP game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 for PSP
        run: psp-pacman -Syu --noconfirm sdl2 || true
      - name: Build
        run: make
      - name: Save the game file
        uses: actions/upload-artifact@v4
        with:
          name: SonicPSP
          path: EBOOT.PBP
